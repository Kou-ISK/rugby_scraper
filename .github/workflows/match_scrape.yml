name: "試合取得"

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - all
      competition:
        description: "大会ID (single時のみ使用)"
        required: true
        default: "m6n"
        type: choice
        options:
          - m6n
          - w6n
          - u6n
          - epcr-champions
          - epcr-challenge
          - t14
          - jrlo
          - premier
          - urc
          - srp
          - wr
          - trc
          - ans
          - nc

permissions:
  contents: write

concurrency:
  group: data-branch-write
  cancel-in-progress: false

jobs:
  scrape-matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch data from data branch
        run: |
          git fetch origin data:data
          git checkout data -- data/ || mkdir -p data/matches
          git restore --source=HEAD -- data/competitions_base.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Regression tests
        run: python -m unittest discover -s tests -v

      - name: Run scrapers
        env:
          PYTHONPATH: .
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "all" ]; then
            python scripts/automation/scrape_all.py
          else
            python scripts/automation/scrape_all.py --competition "${{ inputs.competition }}"
          fi

      - name: Generate competitions summary
        run: |
          python -m src.main generate-metadata

      - name: Commit and push changes to data branch
        if: github.ref == 'refs/heads/main'
        run: |
          scripts/automation/push_data_branch.sh "Update match data - $(date +'%Y-%m-%d %H:%M:%S')"

      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-collection-${{ github.run_id }}
          path: |
            data/manifest.json
            data/source_health.json
            data/scrape_report.json
            data/matches/

      - name: Report source failures after healthy data is published
        run: python -c 'import json, sys; report = json.load(open("data/scrape_report.json")); sys.exit(1 if report["failed_sources"] else 0)'
